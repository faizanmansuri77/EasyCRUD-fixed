services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: easycrud-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: easycrud-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
